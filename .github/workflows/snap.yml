name: Build Snap

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - uses: snapcore/action-build@v1
      id: build
      
    - uses: actions/upload-artifact@v4
      with:
        name: keyflow-snap
        path: ${{ steps.build.outputs.snap }}
