app-id: io.github.maalfer.keyflow
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
command: keyflow
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=home
  - --share=network

modules:
  # Dependencias de Python (deben estar en tu repositorio remoto o aquí)
  - pyside6-requirements.json
  - python3-requirements.json

  # Aplicación principal
  - name: keyflow
    buildsystem: simple
    build-commands:
      - install -D main.py /app/bin/keyflow
      - cp -r src /app/bin/src
      - cp -r assets /app/bin/assets
      - cp requirements.txt /app/bin/requirements.txt
      # Instalar icono y desktop file
      - install -D assets/logo.png /app/share/icons/hicolor/512x512/apps/io.github.maalfer.keyflow.png
      - install -D io.github.maalfer.keyflow.desktop /app/share/applications/io.github.maalfer.keyflow.desktop
      # Wrapper script
      - echo '#!/bin/bash' > /app/bin/keyflow_wrapper
      - echo 'export PYTHONPATH=/app/bin' >> /app/bin/keyflow_wrapper
      - echo 'exec python3 /app/bin/keyflow "$@"' >> /app/bin/keyflow_wrapper
      - chmod +x /app/bin/keyflow_wrapper
      - mv /app/bin/keyflow_wrapper /app/bin/keyflow
    sources:
      - type: git
        url: https://github.com/Maalfer/keyflow.git
        # branch: main
        commit: 94c4b7f0ef6bd6dfe7e9b7208c48a101543ec13d
